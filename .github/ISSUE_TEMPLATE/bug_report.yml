name: Verified or suspected defect
description: Report reproducible incorrect behavior in QuickLootIE.
title: "[Defect]: "
labels:
  - "kind: defect"
  - "status: needs-reproduction"
body:
  - type: markdown
    attributes:
      value: >-
        Do not include private information. Security-sensitive reports belong in
        private vulnerability reporting, as described in SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: QuickLootIE version or commit
      placeholder: ce1b8f0 or release name
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Skyrim, SKSE, and platform versions
      placeholder: Skyrim SE 1.6.1170, SKSE 2.2.6, Windows 11
    validations:
      required: true
  - type: dropdown
    id: input_device
    attributes:
      label: Input device
      options:
        - Keyboard and mouse
        - Xbox-compatible controller
        - DualShock or DualSense controller
        - Steam Input or remapped controller
        - Skyrim VR controller
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include whether the problem reproduces with only required dependencies.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, crash record, save, screenshots, or other evidence
  - type: textarea
    id: modlist
    attributes:
      label: Relevant mods and file conflicts
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing fork and upstream issues.
          required: true
        - label: I identified whether the problem reproduces on a minimal profile, or explained why that test is not possible.
          required: true
        - label: I removed personal or sensitive data from attached logs.
          required: true
